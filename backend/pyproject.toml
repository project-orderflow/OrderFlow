[project]
name = "orderflow-backend"
version = "0.1.0"
description = "Backend service for OrderFlow"
requires-python = ">=3.13"

dependencies = [
    "fastapi",
    "httpx",
    "uvicorn[standard]",
    "pydantic-settings",
    "pwdlib[argon2]",
    "PyJWT",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg",
    "oauthlib",
    "alembic"
]

[project.optional-dependencies]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
